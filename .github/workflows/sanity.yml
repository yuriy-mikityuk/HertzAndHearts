name: sanity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Inline pre-commit avoids pre-commit/action -> actions/cache@v4 (Node 20).
      - run: python -m pip install pre-commit
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0

      - name: Run lightweight tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            test/test_logger.py \
            test/test_profile_store.py \
            test/test_replay_loader.py \
            test/test_update_check.py \
            test/test_meditation.py \
            test/test_meditation_ui.py \
            test/test_model_ibi_diagnostics.py \
            test/test_sensor_decode.py \
            test/test_tag_insights.py \
            test/test_session_report_rebuild.py \
            test/test_session_save_path_regression.py
